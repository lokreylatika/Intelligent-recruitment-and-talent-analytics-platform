<!DOCTYPE html>
<html>
<head>
    <title>Add Job</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Add New Job</h1>

<div class="container">

    <form id="jobForm">

        <label>Job Title:</label>
        <input type="text" id="title" required>
        <br><br>

        <label>Description:</label>
        <textarea id="description" required></textarea>
        <br><br>

        <label>Required Skills:</label>
        <input type="text" id="required_skills" required>
        <br><br>

        <label>Experience (years):</label>
        <input type="number" id="experience" min="0" required>
        <br><br>

        <button type="submit">Add Job</button>

    </form>

    <p id="message"></p>

</div>

<script>

document.getElementById("jobForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const job = {
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        required_skills: document.getElementById("required_skills").value,
        experience: parseInt(document.getElementById("experience").value)
    };

    fetch("api/jobs", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(job)
    })
    .then(response => response.json())
    .then(data => {

        if (data.job_id) {
            document.getElementById("message").innerText =
                "Job created successfully! Job ID: " + data.job_id;

            document.getElementById("jobForm").reset();
        } else {
            document.getElementById("message").innerText =
                data.error || "Failed to create job.";
        }

    })
    .catch(error => {

        console.error(error);

        document.getElementById("message").innerText =
            "Error connecting to Job API.";
    });

});

</script>

</body>
</html>
